      ['10 skills in a row from your first skill', fs * 0.82, '#b6ff6a'],
      ['Front and back skills alternate', fs * 0.82, '#b6ff6a'],
      ['NORMAL: 1–3 somersaults, shape Straight→Pike→Tuck', fs * 0.82, '#b6ff6a'],
      ['HARD: 30 twisting skills come up in order', fs * 0.82, '#b6ff6a'],
      ['After skill 10, straight jump and stick it', fs * 0.82, '#b6ff6a'],
      ['Off-center landings drift you out (PERFECT = back to center)', fs * 0.82, '#b6ff6a'],
      ['▼ CAREFUL', fs * 0.9, '#ffe9a8'],
      ['A straight jump mid-routine ends the routine', fs * 0.82, '#ffb36b'],
      ['Front / back drops score 0 but you continue', fs * 0.82, '#ffb36b'],
      ['Landing on your head ends the game', fs * 0.82, '#ffb36b'],
      ] : [
      ['▼ 操作', fs * 0.9, '#ffe9a8'],
      ['ジャンプは自動', fs * 0.85, '#fff'],
      ['長押ししている間だけ回転', fs * 0.85, '#fff'],
      ['足が真上（12時）に届く手前で離すと きれいに開く', fs * 0.85, '#fff'],
      ['右向きの前方系なら10時45分〜12時15分がPERFECT', fs * 0.85, '#fff'],
      ['矢印が「前宙」のとき押すと前方系', fs * 0.85, '#fff'],
      ['「後宙」のとき押すと後方系', fs * 0.85, '#fff'],
      ['PCはマウスかスペースキーを長押し', fs * 0.85, '#fff'],
      ['▼ 演技', fs * 0.9, '#ffe9a8'],
      ['最初の技から連続10本の合計点で勝負', fs * 0.82, '#b6ff6a'],
      ['演技中は前方系と後方系が交互になる', fs * 0.82, '#b6ff6a'],
      ['NORMAL：技は前後×1〜3回宙、姿勢はL→P→T', fs * 0.82, '#b6ff6a'],
      ['HARD：ひねり入りの30技が順番に自動で入る', fs * 0.82, '#b6ff6a'],
      ['10本目のあとはストレートジャンプでビタ止め', fs * 0.82, '#b6ff6a'],
      ['着地がずれると端へ移動（PERFECTで真ん中に戻る）', fs * 0.82, '#b6ff6a'],
      ['▼ 注意', fs * 0.9, '#ffe9a8'],
      ['演技中にストレートジャンプすると中断', fs * 0.82, '#ffb36b'],
      ['腹落ち・背落ちは0点で続行', fs * 0.82, '#ffb36b'],
      ['頭から落ちたら終了', fs * 0.82, '#ffb36b'],
      ]),
    ], Math.max(50, fs * 3.2) + 8 + Math.max(34, fs * 2) + 12 + 30, wideTitle());
    drawTitleButtons(pb, fs);
  } else if (st === 'over') {
    const sc = calcScore();
    const head = endReason === '演技終了' ? [L('演技終了', 'ROUTINE COMPLETE'), '#ffd23f'] : endReason === '中断' ? [L(`中断（${el.length}本）`, `INTERRUPTED (${el.length})`), '#ffb36b'] : [L(`転倒（${el.length}本）`, `FELL (${el.length})`), '#ff8a8a'];
    const lines = [
      [(mode === 'hard' ? 'HARD ' : 'NORMAL ') + head[0], fs * 1.5, head[1]],
      [L('合計 ', 'TOTAL ') + f3(score), fs * 1.4, '#fff'],
      [`D ${f1(sc.D)}　E ${f1(sc.E)}　T ${f3(sc.T)}　H ${f1(sc.H)}`, fs * 0.8, '#ffe9a8'],
      [newBest ? 'NEW RECORD!' : 'BEST ' + f3(best), fs * 1.0, newBest ? '#ffd23f' : '#dfefff'],
    ];
    if (el.length === 0) lines.push([L('技なし', 'No skills'), fs * 0.8, '#dfefff']);
    el.forEach((e, i) => lines.push([`${i + 1}. ${e.name}　D${f1(e.d)}　E${e.ded ? '−' + f1(e.ded) : '±0'}${e.hd ? '　H−' + f1(e.hd) : ''}`, fs * 0.78, e.d > 0 ? '#ffffff' : '#9fb6cc']));
    const bh1 = 50, bh2 = 42;
    const pb = panel(lines, bh1 + 8 + bh2 + 12 + 26);
    const y1 = Math.min(pb.y + pb.h + 10, H - bh1 - 8 - bh2 - 26), gap = 8, w3 = (pb.w - gap * 2) / 3;
    resultBtns = [
      {x: pb.x, y: y1, w: pb.w, h: bh1, act: shareNative, label: L('結果をシェア', 'SHARE RESULT'), bg: '#ffd23f', fg: '#1b2a4a'},
      {x: pb.x, y: y1 + bh1 + gap, w: w3, h: bh2, act: shareX, label: 'X', bg: '#000000', fg: '#ffffff'},
      {x: pb.x + w3 + gap, y: y1 + bh1 + gap, w: w3, h: bh2, act: shareLINE, label: 'LINE', bg: '#06c755', fg: '#ffffff'},
      {x: pb.x + (w3 + gap) * 2, y: y1 + bh1 + gap, w: w3, h: bh2, act: () => { st = 'title'; }, label: L('タイトルへ', 'TITLE'), bg: '#ffffff', fg: '#1b2a4a'},
    ];
    if (overT > 0.6) for (const b of resultBtns) button(b, b.label, '', b.bg, b.fg);
  }
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = 'rgba(10,30,60,.55)';
  ctx.beginPath(); ctx.arc(34, H - 34, 20, 0, TAU); ctx.fill(); ctx.restore();
  txt('♪', 34, H - 34, 20, muted ? 'rgba(255,255,255,.4)' : '#fff');
  if (muted) { ctx.strokeStyle = '#ff7070'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(22, H - 46); ctx.lineTo(46, H - 22); ctx.stroke(); }
  backBtn = null;
  if (st === 'title') {   // ◀ 言語選択へ戻る
    const lb = LANG === 'en' ? '◀ LANGUAGE' : '◀ 言語選択';
    ctx.font = `800 13px ${FONT}`; const bw = ctx.measureText(lb).width + 26;
    const bl = titleBtns[2];   // 横長の画面では右側のボタン列の下に置く
    backBtn = wideTitle() && bl && bl.y + bl.h + 52 < H ? {x: bl.x + (bl.w - bw) / 2, y: bl.y + bl.h + 10, w: bw, h: 40} : {x: 62, y: H - 54, w: bw, h: 40};
    ctx.save(); ctx.globalAlpha = 0.9; ctx.fillStyle = 'rgba(10,30,60,.6)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(backBtn.x, backBtn.y, bw, 40, 20) : ctx.rect(backBtn.x, backBtn.y, bw, 40); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(lb, backBtn.x + bw / 2, backBtn.y + 21);
  }
  txt('v1.5', W - 14, H - 18, 11, 'rgba(255,255,255,.8)', 'right');
}
function draw() {
  drawBackground();
  drawTrampBack();
  drawPlayer();
  drawTrampFront();
  drawIndicator();
  drawHUD();
  drawOverlay();
  if (st === 'splash') drawSplash();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (tutTip) { tutTip.t += dt; if (tutTip.t > 2.6) tutTip = null; }
  const slow = tutOn && st === 'play' && holding && el.length < 2 ? 0.5 : 1;   // 練習中は回転をゆっくり
  syncSize(); update(dt * slow); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
