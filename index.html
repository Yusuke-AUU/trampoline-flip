<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="description" content="長押しだけで宙返り。前後交互に10本の演技を決めて、最後はビタ止め。競技用トランポリンのブラウザゲーム。">
<meta name="theme-color" content="#0f2a5e">

<meta property="og:description" content="長押しだけで宙返り。10本の演技をビタ止めで決めろ！">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e9dfc6;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
let W, H, DPR, S, bedY, cx;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(H / 10.8, W / 6.0);       // px per meter
  bedY = H - 2.0 * S;                      // screen y of bed (world y=0) when camera at 0
  cx = W / 2;
}
addEventListener('resize', resize); resize();

// ---- 定数 ----
const G = 11;          // 重力 m/s^2
const TW = 10.5;       // 抱え込み時の回転速度 rad/s
const MAXH = 6.5;      // 最高到達（m）
const CT = 0.26;       // 接地時間 s
const GROUND = -1.15;  // 床の高さ（競技用トランポリンの高さ 約1.15m）
const TAU = Math.PI * 2;
const na = a => a - TAU * Math.round(a / TAU);

// ---- 状態 ----
let st = 'title', p, holding = false, time = 0;
let score = 0, best = 0, jumps = 0, totalFlips = 0, combo = 0, maxCombo = 0;
let pops = [], camY = 0, bedDepth = 0, crashT = 0, overT = 0, newBest = false;
let el = [], endReason = '', lastDir = 0;
const SHAPES = ['L', 'P', 'T'];   // 伸身 → 屈身 → 抱え込み の順に自動で変わる
const SHAPE_JA = {L: '伸身', P: '屈身', T: '抱え込み'};
let dirCount = {1: 0, '-1': 0};   // 方向ごとに決めた宙返りの本数   // lastDir: 直前の技の方向（+1前/-1後）   // 演技（10本）の記録
try { best = +localStorage.getItem('tflip_best10') || 0; } catch (e) {}

// ---- サウンド ----
let AC = null, muted = false, whoosh = null;
try { muted = localStorage.getItem('tflip_mute') === '1'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.9;
    const g = AC.createGain(); g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start();
    whoosh = {g, bp};
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type = 'sine', vol = 0.25, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  bounce: v => tone(150 + v * 5, 70, 0.22, 'sine', 0.35),
  good: () => { tone(660, 660, 0.12, 'triangle', 0.14); tone(880, 880, 0.16, 'triangle', 0.14, 0.08); },
  perfect: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.14, i * 0.07)),
  drop: () => tone(120, 55, 0.32, 'sine', 0.45),
  twist: () => tone(500, 1100, 0.18, 'triangle', 0.06),
  fail: () => { tone(220, 45, 0.55, 'sawtooth', 0.12); tone(90, 40, 0.4, 'sine', 0.4, 0.05); },
};

const clouds = Array.from({length: 5}, (_, i) => ({x: Math.random(), y: 0.08 + Math.random() * 0.35, s: 0.6 + Math.random() * 0.8, v: 0.004 + Math.random() * 0.006}));

function resetPlayer() {
  p = {x: 0, vx: 0, y: 0.9, vy: 0, th: 0, w: 0, tuck: 0, crouch: 0, contact: true, contactT: 0, D: 0.3,
       airT: 0, dir: 0, lean: 0, leanK: 1, leanPh: 0, bounceN: 0, apex: 0, flail: 0, drop: 0, recover: false, face: 1, twist: -1, twisted: false, final: false, finalJump: false, stick: false, stickT: 0};
}
function startGame() {
  st = 'play'; score = 0; jumps = 0; totalFlips = 0; combo = 0; maxCombo = 0; pops = []; newBest = false; el = []; endReason = ''; lastDir = 0; dirCount = {1: 0, '-1': 0};
  resetPlayer();
}
resetPlayer();

// ---- 姿勢 ----
const dirv = (a, l) => [Math.sin(a) * l, Math.cos(a) * l]; // a=0 下, π 上, 正=前方
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const P_L = {to: Math.PI, ua: Math.PI - 0.15, fa: Math.PI - 0.1, th: 0, sh: 0};
const P_T = {to: Math.PI - 0.4, ua: 0.8, fa: 0.15, th: 1.79, sh: -0.45};          // 抱え込み
const P_P = {to: 0.78, ua: -0.55, fa: -0.85, th: 0.1, sh: 0.1};                 // 屈身（脚を伸ばしたまま上体を脚に折りたたむ）
const P_S = {to: Math.PI, ua: 0.12, fa: 0.06, th: -0.06, sh: -0.03};             // 伸身（まっすぐ、腕は体側）
const SHAPE_POSE = {T: P_T, P: P_P, L: P_S};
const nextShape = d => SHAPES[(dirCount[d] || 0) % 3];
const P_C = {to: Math.PI - 0.3, ua: -0.5, fa: -0.3, th: 0.9, sh: -0.75};
function pose() {
  const o = {};
  const TG = SHAPE_POSE[p.shape] || P_T;
  for (const k in P_L) o[k] = P_L[k] + (TG[k] - P_L[k]) * p.tuck + (P_C[k] - P_L[k]) * p.crouch;
  if (p.flail > 0.01) {
    const f = p.flail, t = time;
    o.ua += f * 1.6 * Math.sin(t * 13); o.fa += f * 1.1 * Math.sin(t * 17 + 1);
    o.th += f * 0.9 * Math.sin(t * 11 + 2); o.sh += f * 0.9 * Math.sin(t * 15);
    o.to += f * 0.35 * Math.sin(t * 9);
  }
  return o;
}
function joints(o, off = {}) {
  const hip = [0, 0];
  const sh = dirv(o.to, 0.55);
  const head = dirv(o.to, 0.72);
  const elbow = add(sh, dirv(o.ua + (off.ua || 0), 0.3));
  const hand = add(elbow, dirv(o.fa + (off.ua || 0), 0.28));
  const knee = dirv(o.th + (off.th || 0), 0.45);
  const foot = add(knee, dirv(o.sh + (off.sh || 0), 0.45));
  return {hip, sh, head, elbow, hand, knee, foot};
}
// 体の傾き（lean）は方向とタイミングの判定・矢印表示にだけ使い、見た目の体は傾けない
function disp() { return p.th; }
// 回転の中心：屈身・抱え込みは体の重心まわりに回す（腰まわりだと大きく振れて見えるため）
function pivot(J) {
  const w = (p.shape === 'P' || p.shape === 'T' || !p.shape) ? p.tuck : 0;
  if (w < 0.01) return [0, 0];
  J = J || joints(pose());
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const parts = [[mid(J.hip, J.sh), 0.45], [J.head, 0.08], [mid(J.hip, J.knee), 0.2], [mid(J.knee, J.foot), 0.12],
                 [mid(J.sh, J.elbow), 0.08], [mid(J.elbow, J.hand), 0.07]];
  let x = 0, y = 0; for (const [q, m] of parts) { x += q[0] * m; y += q[1] * m; }
  return [x * w, y * w];
}
function toWorld(l, A, c) {
  c = c || [0, 0];
  const co = Math.cos(A), s = Math.sin(A), dx = l[0] - c[0], dy = l[1] - c[1];
  return [p.x + c[0] + (dx * co - dy * s), p.y - (c[1] + dx * s + dy * co)];
}
function lowest() {
  const j = joints(pose()), A = disp(), pc = pivot(j);
  let m = Infinity;
  for (const k of ['hip', 'sh', 'elbow', 'hand', 'knee', 'foot']) m = Math.min(m, toWorld(j[k], A, pc)[1]);
  m = Math.min(m, toWorld(j.head, A, pc)[1] - 0.12);
  return m;
}
function footY() { return joints(pose()).foot[1]; }

// ---- 入力 ----
function down() {
  if (st === 'title') { startGame(); return; }
  if (st === 'over') { if (overT > 0.6) startGame(); return; }
  if (st === 'play') holding = true;
}
function up() { holding = false; }
function toggleMute() { muted = !muted; try { localStorage.setItem('tflip_mute', muted ? '1' : '0'); } catch (e) {} }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (e.clientX < 64 && e.clientY > H - 64) { toggleMute(); return; }
  down();
});
addEventListener('pointerup', up); addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { initAudio(); if (e.code === 'KeyM') toggleMute(); if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); down(); } });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') up(); });

// ---- 更新 ----
function pop(text, color = '#fff', size = 1, dy = 0) {
  pops.push({text, color, size, t: 0, x: p.x, y: p.y + 1.4 + dy});
}
function fullName(turns, sh) {   // 1回宙返りは姿勢が技名に入る（タック/パイク/レイアウト）
  sh = sh || 'T';
  if (Math.abs(turns) === 1) return ({L: 'レイアウト', P: 'パイク', T: 'タック'})[sh] + (turns > 0 ? 'バラニー' : 'バック');
  return `${flipName(turns)}（${sh}）`;
}
function flipName(turns) {
  const n = Math.abs(turns), f = turns > 0;
  if (n === 1) return f ? 'タックバラニー' : 'タックバック';
  if (n === 2) return f ? 'バラニーアウト' : 'ダブルバック';
  if (n === 3) return f ? 'トリフィスアウト' : 'トリプルバック';
  return `${n}回宙返り（${f ? '前' : '後'}）`;
}
function launch() {
  p.contact = false; p.crouch = 0; p.w = 0; p.dir = 0; p.airT = 0; p.twisted = false; p.twist = -1; p.shape = null;
  p.leanPh = Math.random() < 0.5 ? 0 : Math.PI;
  p.finalJump = p.final;   // 10本目の後は最後のストレートジャンプ
  p.forceDir = st === 'play' && lastDir ? -lastDir : 0;   // 演技中は前後を交互に固定
  if (p.drop) {            // 腹落ち・背落ちからの立て直しジャンプ
    p.drop = 0; p.recover = true; p.leanK = 0; p.bounceN = 0;
  } else {
    p.recover = false; p.th = 0; p.leanK = p.finalJump ? 0 : 1; p.y = footY();
  }
  p.bounceN++;
  let h = Math.min(st === 'title' ? 2.4 : MAXH, 1.0 + p.bounceN * 1.3);
  if (st === 'play' && h >= MAXH) h -= Math.random() * 0.8;   // 最高点付近は毎回少し高さが変わる
  if (p.finalJump && !p.recover) h = 2.4;
  p.vy = Math.sqrt(2 * G * h); p.apex = 0;
  if (st === 'play') jumps++;
}
function addElement(name, pts, color) {
  el.push({name, pts}); score += pts;
  pop(`${el.length}/10`, '#ffffff', 0.8, 1.5);
  if (el.length === 10) {
    p.final = true;
    pop('10本完了！最後はストップ', '#ffd23f', 0.8, -1.0);
  }
}
function touchdown() {
  const d = disp(), a = na(d);
  const turns = Math.round((d - a) / TAU), aa = Math.abs(a);
  if (p.dir > 0 && !p.twisted && turns > 0) finishTwist();
  else if (p.twist >= 0) finishTwist();
  sfx.bounce(Math.abs(p.vy));
  if (st !== 'play') { normalContact(a); return; }
  if (aa < 0.75) {
    const n = Math.abs(turns);
    if (p.finalJump) { startStick(a, '演技終了'); return; }
    if (n > 0) {
      totalFlips += n;
      const base = [0, 100, 300, 700, 1500][Math.min(n, 4)] + Math.max(0, n - 4) * 1000;
      // 着地の綺麗さで倍率
      const grade = aa < 0.12 ? ['PERFECT!', 1.5, '#ff7ab8'] : aa < 0.35 ? ['GOOD', 1.0, '#b6ff6a'] : ['着地乱れ', 0.6, '#ffb36b'];
      const pts = Math.round(base * (turns > 0 ? 1.1 : 1) * grade[1] + p.apex * 10);
      pop(fullName(turns, p.shape), turns > 0 ? '#ffd23f' : '#7fe0ff', 1.1, 0.5);
      pop('+' + pts, '#fff', 1.0, 0);
      pop(grade[0], grade[2], 0.9, -0.5);
      aa < 0.12 ? sfx.perfect() : sfx.good();
      lastDir = Math.sign(turns);
      const sh = p.shape || 'T';
      dirCount[Math.sign(turns)] = (dirCount[Math.sign(turns)] || 0) + 1;
      addElement(fullName(turns, sh), pts);
    } else if (el.length > 0 && !p.recover) {   // 演技中のストレートジャンプ＝中断
      startStick(a, '中断'); return;
    }
    normalContact(a);
  } else if (aa < 2.35) {
    if (p.finalJump) { startStick(a, '演技終了'); return; }
    drop(a);
    if (el.length > 0) addElement(a > 0 ? '腹落ち' : '背落ち', 0);
  } else crash(d);
}
function normalContact(a) {
  p.th = a; p.w = 0; p.contact = true; p.contactT = 0;
  p.D = Math.min(0.75, 0.25 + Math.abs(p.vy) * 0.04);
}
function startStick(a, reason) {
  p.th = Math.abs(a) < 0.75 ? a : 0; p.w = 0; p.contact = true; p.stick = true; p.stickT = 0; p.drop = 0;
  p.D = Math.min(0.75, 0.25 + Math.abs(p.vy) * 0.04);
  endReason = reason;
  if (reason === '演技終了') { pop(Math.abs(a) < 0.15 ? 'ビタ止め！' : 'フィニッシュ', '#ffd23f', 1.3, 0.6); sfx.perfect(); }
  else { pop('中断', '#ffb36b', 1.3, 0.6); sfx.drop(); }
}
function finishTwist() {
  if (p.twist < 0 && p.twisted) return;
  p.face = -p.face; p.twist = -1; p.twisted = true;
  if (st === 'play') pop('1/2ひねり', '#ffe9a8', 0.75, 1.0);
}
function drop(a) {
  p.th = a; p.w = 0; p.leanK = 0; p.lean = 0; p.dir = 0;
  p.drop = Math.sign(a);   // +1 腹落ち / -1 背落ち
  p.contact = true; p.contactT = 0;
  p.D = Math.min(0.3, 0.12 + Math.abs(p.vy) * 0.02);
  pop(a > 0 ? '腹落ち' : '背落ち', '#9fd0ff', 1.1, 0.4);
  if (el.length > 0) pop('0点', '#e6e6e6', 0.8, -0.2);
  sfx.drop();
}
function crash(d) {
  st = 'crash'; crashT = 0; endReason = '転倒';
  p.th = d; p.leanK = 0; p.lean = 0;
  const s = Math.sign(p.w) || (Math.random() < 0.5 ? -1 : 1);
  p.vy = 3 + Math.random() * 1.5;
  p.vx = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.3);
  p.w = s * (4 + Math.random() * 3); p.flail = 1; bedDepth = 0.35;
  pop('失敗…', '#ff6b6b', 1.2, 0.3); sfx.fail();
}
function airUpdate(dt) {
  p.airT += dt; p.vy -= G * dt; p.y += p.vy * dt;
  p.apex = Math.max(p.apex, p.y - 0.9);
  const per = Math.max(0.7, 1.1 - 0.035 * el.length);   // 演技が進むほど傾きの揺れが速くなる
  p.lean = 0.3 * Math.sin(p.leanPh + p.airT * TAU / per);
  if (p.recover) {
    p.th += (0 - p.th) * (1 - Math.exp(-dt * 3.5));
    p.tuck *= Math.exp(-dt * 10); p.w = 0;
  } else if (holding && st === 'play' && !p.finalJump) {
    if (!p.dir) { p.dir = p.forceDir || (p.lean >= 0 ? 1 : -1); p.shape = nextShape(p.dir); }
    p.w += (p.dir * TW - p.w) * (1 - Math.exp(-dt * 9));
    p.tuck += (1 - p.tuck) * (1 - Math.exp(-dt * 14));
  } else {
    p.w *= Math.exp(-dt * 4.5);
    p.tuck *= Math.exp(-dt * 10);
  }
  if (p.dir) p.leanK *= Math.exp(-dt * 6);
  p.th += p.w * dt;
  // 前方系は回転を止めた後、自動で1/2ひねり（向きが反転）
  if (p.dir > 0 && !holding && !p.twisted && p.twist < 0 && Math.abs(p.w) < 3 && p.vy < 0) { p.twist = 0; sfx.twist && sfx.twist(); }
  if (p.twist >= 0) { p.twist += dt / 0.32; if (p.twist >= 1) finishTwist(); }
  bedDepth *= Math.exp(-dt * 10);
  if (p.vy < 0 && lowest() <= 0) touchdown();
}
function contactUpdate(dt) {
  p.contactT += dt;
  const k = Math.min(1, p.contactT / CT), s = Math.sin(Math.PI * k);
  if (p.stick) {   // ストップ（ビタ止め）
    p.stickT += dt; const t = p.stickT, h = CT / 2;
    bedDepth = t < h ? p.D * Math.sin(Math.PI * t / CT) : p.D * Math.exp(-(t - h) * 3.5) * Math.abs(Math.cos((t - h) * 11));
    p.crouch = t < h ? 0.85 * Math.sin(Math.PI * t / CT) : 0.85 * Math.exp(-(t - h) * 3);
    p.tuck *= Math.exp(-dt * 15); p.th *= Math.exp(-dt * 12); p.lean = 0;
    p.y = -bedDepth + footY();
    if (t > 1.5 && st === 'play') { st = 'over'; overT = 0; finalize(); }
    return;
  }
  if (p.drop) {
    p.crouch = 0; p.tuck *= Math.exp(-dt * 15);
    p.th += (p.drop * Math.PI / 2 - p.th) * (1 - Math.exp(-dt * 15));
    bedDepth = p.D * s;
    p.y += 0.1 - bedDepth * 0.6 - lowest();
    if (k >= 1) launch();
    return;
  }
  p.crouch = 0.85 * s; p.tuck *= Math.exp(-dt * 15); p.th *= Math.exp(-dt * 18); p.lean = 0;
  bedDepth = p.D * s;
  p.y = -bedDepth + footY();
  if (k >= 1) launch();
}
function crashUpdate(dt) {
  p.vy -= G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.th += p.w * dt;
  p.tuck *= Math.exp(-dt * 3);
  const low = lowest();
  const ax = Math.abs(p.x);
  const floor = ax < 2.5 ? 0 : ax < 4.2 ? GROUND + 0.3 : GROUND;
  if (low < floor) {
    p.y += floor - low;
    if (p.vy < 0) {
      p.vy = -p.vy * (floor === 0 ? 0.55 : 0.25);
      if (floor === 0) bedDepth = Math.min(0.4, bedDepth + Math.abs(p.vy) * 0.05);
      p.w *= 0.65; p.vx *= 0.85;
      if (Math.abs(p.vy) < 0.6) p.vy = 0;
    }
    if (p.vy === 0) { p.vx *= Math.exp(-dt * 4); p.w *= Math.exp(-dt * 5); p.flail *= Math.exp(-dt * 2); }
  }
  bedDepth *= Math.exp(-dt * 6);
}
function finalize() {
  if (score > best) { best = score; newBest = score > 0; try { localStorage.setItem('tflip_best10', best); } catch (e) {} }
}
function update(dt) {
  time += dt;
  if (st === 'over' && p.stick) { overT += dt; contactUpdate(dt); }
  else if (st === 'crash' || st === 'over') {
    crashUpdate(dt);
    if (st === 'crash') { crashT += dt; if (crashT > 1.8) { st = 'over'; overT = 0; finalize(); } }
    else overT += dt;
  } else if (p.contact) contactUpdate(dt);
  else airUpdate(dt);
  if (whoosh) {
    const on = !muted && st === 'play' && !p.contact;
    const tg = on ? Math.min(0.13, Math.abs(p.w) / TW * 0.13) : 0;

  for (const q of pops) {
    const a = q.t < 1 ? 1 : 1 - (q.t - 1) / 0.4;
    txt(q.text, Math.min(W - 80, Math.max(80, sx(q.x))), sy(q.y), Math.round(fs * 1.3 * q.size), q.color, 'center', a);
  }
}
function panel(lines) {
  const h = 30 + lines.reduce((t, l) => t + l[1] * 1.55, 0);
  const w = Math.min(W - 32, 420), x = (W - w) / 2, y = H * 0.16;
  ctx.fillStyle = 'rgba(12,28,58,.9)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 18) : ctx.rect(x, y, w, h); ctx.fill();
  let yy = y + 34;
  for (const [s, size, col] of lines) { txt(s, W / 2, yy, size, col); yy += size * 1.55; }
}
function drawOverlay() {
  const fs = Math.max(14, Math.min(20, W / 24));
  if (st === 'title') {
    panel([
      ['TRAMPOLINE FLIP', fs * 1.8, '#ffd23f'],
      ['ジャンプは自動', fs, '#fff'],
      ['長押し中だけ回転（抱え込み）', fs, '#fff'],
      ['押した瞬間の体の傾きで方向が決まる', fs * 0.85, '#dfefff'],
      ['前に傾き→前宙 ／ 後ろに傾き→後宙', fs * 0.85, '#dfefff'],
      ['離すと体が開いて回転が止まる', fs * 0.85, '#dfefff'],
      ['姿勢は 伸身(L)→屈身(P)→抱え込み(T) の順に自動', fs * 0.8, '#dfefff'],
      ['前方系は自動で1/2ひねりして向きが変わる', fs * 0.85, '#dfefff'],
      ['最初の技から連続10本の合計点で勝負', fs * 0.85, '#b6ff6a'],
      ['10本の後はストレートジャンプでビタ止め', fs * 0.85, '#b6ff6a'],
      ['演技中は前方→後方→前方…と交互に自動で切替', fs * 0.8, '#b6ff6a'],
      ['途中のストレートジャンプは中断', fs * 0.85, '#ffb36b'],
      ['腹落ち・背落ちは0点で続行／頭から落ちたら終了', fs * 0.8, '#9fd0ff'],
      ['タップでスタート', fs * 1.2, '#ffd23f'],
    ]);
  } else if (st === 'over') {
    const head = endReason === '演技終了' ? ['演技終了', '#ffd23f'] : endReason === '中断' ? [`中断（${el.length}本）`, '#ffb36b'] : [`転倒（${el.length}本）`, '#ff8a8a'];
    const lines = [
      [head[0], fs * 1.7, head[1]],
      ['合計 ' + score, fs * 1.4, '#fff'],
      [newBest ? 'NEW RECORD!' : 'BEST ' + best, fs * 1.0, newBest ? '#ffd23f' : '#dfefff'],
    ];
    if (el.length === 0) lines.push(['技なし', fs * 0.8, '#dfefff']);
    el.forEach((e, i) => lines.push([`${i + 1}. ${e.name}　${e.pts}`, fs * 0.78, e.pts > 0 ? '#ffffff' : '#9fb6cc']));
    lines.push(['タップでもう一度', fs * 1.1, '#ffd23f']);
    panel(lines);
  }
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = 'rgba(10,30,60,.55)';
  ctx.beginPath(); ctx.arc(34, H - 34, 20, 0, TAU); ctx.fill(); ctx.restore();
  txt('♪', 34, H - 34, 20, muted ? 'rgba(255,255,255,.4)' : '#fff');
  if (muted) { ctx.strokeStyle = '#ff7070'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(22, H - 46); ctx.lineTo(46, H - 22); ctx.stroke(); }
  txt('v0.8.3', W - 14, H - 18, 11, 'rgba(255,255,255,.8)', 'right');
}
function draw() {
  drawBackground();
  drawTrampBack();
  drawPlayer();
  drawTrampFront();
  drawIndicator();
  drawHUD();
  drawOverlay();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
