<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
let W, H, DPR, S, bedY, cx;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(H / 10.8, W / 6.0);       // px per meter
  bedY = H - 2.0 * S;                      // screen y of bed (world y=0) when camera at 0
  cx = W / 2;
}
addEventListener('resize', resize); resize();

// ---- 定数 ----
const G = 11;          // 重力 m/s^2
const TW = 10.5;       // 抱え込み時の回転速度 rad/s
const MAXH = 6.5;      // 最高到達（m）
const CT = 0.26;       // 接地時間 s
const GROUND = -1.15;  // 床の高さ（競技用トランポリンの高さ 約1.15m）
const TAU = Math.PI * 2;
const na = a => a - TAU * Math.round(a / TAU);

// ---- 状態 ----
let st = 'title', p, holding = false, time = 0;
let score = 0, best = 0, jumps = 0, totalFlips = 0, combo = 0, maxCombo = 0;
let pops = [], camY = 0, bedDepth = 0, crashT = 0, overT = 0, newBest = false;
let el = [], endReason = '', lastDir = 0;
const SHAPES = ['L', 'P', 'T'];   // 伸身 → 屈身 → 抱え込み の順に自動で変わる
const SHAPE_JA = {L: '伸身', P: '屈身', T: '抱え込み'};
let dirCount = {1: 0, '-1': 0};   // 方向ごとに決めた宙返りの本数   // lastDir: 直前の技の方向（+1前/-1後）   // 演技（10本）の記録
let mode = 'normal';   // 'normal'＝技6種類 ／ 'hard'＝30技
const bestKey = () => `tflip_best_${mode}`;
function loadBest() { try { best = +localStorage.getItem(bestKey()) || 0; } catch (e) { best = 0; } }
loadBest();

// ---- サウンド ----
let AC = null, muted = false, whoosh = null;
try { muted = localStorage.getItem('tflip_mute') === '1'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.9;
    const g = AC.createGain(); g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start();
    whoosh = {g, bp};
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type = 'sine', vol = 0.25, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  bounce: v => tone(150 + v * 5, 70, 0.22, 'sine', 0.35),
  good: () => { tone(660, 660, 0.12, 'triangle', 0.14); tone(880, 880, 0.16, 'triangle', 0.14, 0.08); },
  perfect: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.14, i * 0.07)),
  drop: () => tone(120, 55, 0.32, 'sine', 0.45),
  twist: () => tone(500, 1100, 0.18, 'triangle', 0.06),
  fail: () => { tone(220, 45, 0.55, 'sawtooth', 0.12); tone(90, 40, 0.4, 'sine', 0.4, 0.05); },
};

const clouds = Array.from({length: 5}, (_, i) => ({x: Math.random(), y: 0.08 + Math.random() * 0.35, s: 0.6 + Math.random() * 0.8, v: 0.004 + Math.random() * 0.006}));

function resetPlayer() {
  p = {x: 0, vx: 0, y: 0.9, vy: 0, th: 0, w: 0, tuck: 0, crouch: 0, contact: true, contactT: 0, D: 0.3,
       airT: 0, dir: 0, lean: 0, leanK: 1, leanPh: 0, bounceN: 0, apex: 0, flail: 0, drop: 0, recover: false, face: 1, twist: -1, twisted: false, final: false, finalJump: false, stick: false, stickT: 0, opened: false, openK: 0, openTarget: 0, wasHolding: false, rotFace: 1};
}
function startGame(m) {
  if (m) { mode = m; loadBest(); }
  st = 'play'; score = 0; jumps = 0; totalFlips = 0; combo = 0; maxCombo = 0; pops = []; newBest = false; el = []; endReason = ''; lastDir = 0; dirCount = {1: 0, '-1': 0}; skillCount = {};
  resetPlayer();
}
resetPlayer();

// ---- 姿勢 ----
const dirv = (a, l) => [Math.sin(a) * l, Math.cos(a) * l]; // a=0 下, π 上, 正=前方
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const P_L = {to: Math.PI, ua: Math.PI - 0.15, fa: Math.PI - 0.1, th: 0, sh: 0};
const P_T = {to: Math.PI - 0.4, ua: 0.8, fa: 0.15, th: 1.79, sh: -0.45};          // 抱え込み
const P_P = {to: 0.78, ua: -0.55, fa: -0.85, th: 0.1, sh: 0.1};                 // 屈身（脚を伸ばしたまま上体を脚に折りたたむ）
const P_S = {to: Math.PI, ua: 0.12, fa: 0.06, th: -0.06, sh: -0.03};             // 伸身（まっすぐ、腕は体側）
const SHAPE_POSE = {T: P_T, P: P_P, L: P_S};
const nextShape = d => SHAPES[(dirCount[d] || 0) % 3];
// ---- 技の一覧：回転数ごとに、使うたびに1本目→5本目の順で自動で切り替わる ----
// h：各宙返りのひねり（1/2回単位）、s：姿勢（L伸身／P屈身／T抱え込み）
const SKILLS = {
  1: {   // 前方
    1: [{n: 'レイアウトバラニー', h: [1], s: 'L'}, {n: 'パイクバラニー', h: [1], s: 'P'}, {n: 'タックバラニー', h: [1], s: 'T'}, {n: 'ルディー', h: [3], s: 'L'}, {n: 'ランディー', h: [5], s: 'L'}],
    2: [{n: 'フルイン・ランディーアウト', h: [2, 5], s: 'L'}, {n: 'フルイン・ルディーアウト', h: [2, 3], s: 'L'}, {n: 'フルイン・バラニーアウト', h: [2, 1], s: 'L'}, {n: 'ルディーアウト', h: [0, 3], s: 'P'}, {n: 'バラニーアウト', h: [0, 1], s: 'P'}],
    3: [{n: 'フルイン・トリフィス・バラニー', h: [2, 0, 1], s: 'P'}, {n: 'トリフィス・ルディー', h: [0, 0, 3], s: 'P'}, {n: 'トリフィス・バラニーアウト', h: [0, 0, 1], s: 'P'}, {n: 'フルイン・トリフィス・バラニー', h: [2, 0, 1], s: 'T'}, {n: 'トリフィス・ルディー', h: [0, 0, 3], s: 'T'}],
  },
  '-1': {   // 後方
    1: [{n: 'レイアウトバック', h: [0], s: 'L'}, {n: 'パイクバック', h: [0], s: 'P'}, {n: 'タックバック', h: [0], s: 'T'}, {n: 'バックフル', h: [2], s: 'L'}, {n: 'ダブルフル', h: [4], s: 'L'}],
    2: [{n: 'ダブルイン・トリプル', h: [4, 2], s: 'L'}, {n: 'ダブルイン・ダブル', h: [4, 0], s: 'L'}, {n: 'フルイン・ダブル', h: [2, 0], s: 'L'}, {n: 'ハーフイン・ハーフアウト', h: [1, 1], s: 'P'}, {n: 'フルイン・フルアウト', h: [2, 2], s: 'L'}],
    3: [{n: 'ハーフイン・トリフィス・ルディー', h: [1, 0, 3], s: 'P'}, {n: 'ハーフイン・トリフィス・ルディー', h: [1, 0, 3], s: 'T'}, {n: 'ハーフイン・トリフィス・バラニーアウト', h: [1, 0, 1], s: 'P'}, {n: 'ハーフイン・トリフィス・バラニーアウト', h: [1, 0, 1], s: 'T'}, {n: 'フルイン・フル・フルアウト', h: [2, 2, 2], s: 'L'}],
  },
};
let skillCount = {};   // 「方向_回転数」ごとに決めた本数
const SHAPE_SYM = {T: 'o', P: '<', L: '/'};
const numeric = (n, h, sh) => `${n * 4} ${h.join(' ')} ${SHAPE_SYM[sh]}`;
// 踏み切ってから押した瞬間の残り時間で、何回宙返りを狙うかを決める
function planSkill() {
  if (mode === 'normal') {   // NORMAL：姿勢は方向ごとに L→P→T、前方は開いてから1/2ひねり
    p.plan = {normal: true, s: nextShape(p.dir)}; p.shape = p.plan.s; return;
  }
  const t = timeToLand();
  let n = 1;
  for (let k = 3; k >= 1; k--) { if (0.12 + (TAU * k - Math.PI - 0.26) / TW + 0.25 <= t) { n = k; break; } }
  const key = `${p.dir}_${n}`, list = SKILLS[p.dir][n], idx = (skillCount[key] || 0) % list.length;
  const sk = list[idx];
  p.plan = {n, h: sk.h, s: sk.s, name: sk.n};
  p.shape = sk.s;
}
// ひねりの進み具合（1/2回単位）。各宙返りの回転に合わせて入る（最後の宙返りは開いてから）
function halvesDone() {
  if (!p.plan) return 0;
  if (p.plan.normal) {
    if (p.dir < 0 || !p.opened) return 0;
    const ph = p.th * p.dir, f = Math.min(1, Math.max(0, (ph - p.openPhi) / Math.max(0.3, p.openTarget * p.dir - p.openPhi - 0.25)));
    return f * f * (3 - 2 * f);
  }
  const phi = Math.max(0, p.th * p.dir); let tot = 0;
  const H = p.plan.h;
  for (let k = 0; k < H.length; k++) {
    if (!H[k]) continue;
    const last = k === H.length - 1;
    const a0 = TAU * (k + (last ? 0.45 : 0.15)), a1 = TAU * (k + (last ? 0.95 : 0.85));
    const f = Math.min(1, Math.max(0, (phi - a0) / (a1 - a0)));
    tot += H[k] * f * f * (3 - 2 * f);
  }
  return tot;
}
function skillName(n, h, sh, dir) {
  if (p.plan && p.plan.normal) return fullName(n * dir, sh);
  if (p.plan && n === p.plan.n) return p.plan.name + (n >= 2 ? `（${sh}）` : '');
  return `${dir > 0 ? '前方' : '後方'}${n}回宙返り ${numeric(n, h, sh)}`;
}
const P_C = {to: Math.PI - 0.3, ua: -0.5, fa: -0.3, th: 0.9, sh: -0.75};
function pose() {
  const o = {};
  const TG = SHAPE_POSE[p.shape] || P_T;
  for (const k in P_L) o[k] = P_L[k] + (TG[k] - P_L[k]) * p.tuck + (P_C[k] - P_L[k]) * p.crouch;
  if (p.openK > 0.001) for (const k in P_L) o[k] += (P_S[k] - o[k]) * p.openK;   // 開き：体がビンと伸びる
  if (p.flail > 0.01) {
    const f = p.flail, t = time;
    o.ua += f * 1.6 * Math.sin(t * 13); o.fa += f * 1.1 * Math.sin(t * 17 + 1);
    o.th += f * 0.9 * Math.sin(t * 11 + 2); o.sh += f * 0.9 * Math.sin(t * 15);
    o.to += f * 0.35 * Math.sin(t * 9);
  }
  return o;
}
function joints(o, off = {}) {
  const hip = [0, 0];
  const sh = dirv(o.to, 0.55);
  const head = dirv(o.to, 0.72);
  const elbow = add(sh, dirv(o.ua + (off.ua || 0), 0.3));
  const hand = add(elbow, dirv(o.fa + (off.ua || 0), 0.28));
  const knee = dirv(o.th + (off.th || 0), 0.45);
  const foot = add(knee, dirv(o.sh + (off.sh || 0), 0.45));
  return {hip, sh, head, elbow, hand, knee, foot};
}
// 体の傾き（lean）は方向とタイミングの判定・矢印表示にだけ使い、見た目の体は傾けない
function disp() { return p.th; }
// 回転の中心：屈身・抱え込みは体の重心まわりに回す（腰まわりだと大きく振れて見えるため）
function pivot(J) {
  const w = (p.shape === 'P' || p.shape === 'T' || !p.shape) ? p.tuck : 0;
  if (w < 0.01) return [0, 0];
  J = J || joints(pose());
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const parts = [[mid(J.hip, J.sh), 0.45], [J.head, 0.08], [mid(J.hip, J.knee), 0.2], [mid(J.knee, J.foot), 0.12],
                 [mid(J.sh, J.elbow), 0.08], [mid(J.elbow, J.hand), 0.07]];
  let x = 0, y = 0; for (const [q, m] of parts) { x += q[0] * m; y += q[1] * m; }
  return [x * w, y * w];
}
// ひねり：体の長軸まわりの左右反転（bodyS）。画面上の回転方向は離陸時の向き（rotFace）のまま変えない
function bodyS() {
  let b;
  if (p.plan) b = Math.cos(Math.PI * halvesDone());   // 技のひねり
  else { const fx = p.twist >= 0 ? p.face * Math.cos(Math.PI * p.twist) : p.face; b = fx * (p.rotFace || 1); }
  return b < 0 ? Math.min(-0.12, b) : Math.max(0.12, b);
}
function toWorld(l, A, c) {
  c = c || [0, 0];
  const bs = bodyS(), rf = p.rotFace || 1;
  const co = Math.cos(A), s = Math.sin(A), cx = c[0] * bs, dx = l[0] * bs - cx, dy = l[1] - c[1];
  return [p.x + rf * (cx + (dx * co - dy * s)), p.y - (c[1] + dx * s + dy * co)];
}
function lowest() {
  const j = joints(pose()), A = disp(), pc = pivot(j);
  let m = Infinity;
  for (const k of ['hip', 'sh', 'elbow', 'hand', 'knee', 'foot']) m = Math.min(m, toWorld(j[k], A, pc)[1]);
  m = Math.min(m, toWorld(j.head, A, pc)[1] - 0.12);
  return m;
}
function footY() { return joints(pose()).foot[1]; }

// ---- 入力 ----
let titleBtns = [];
const hit = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function down(x, y) {
  if (st === 'list') return;
  if (st === 'title') {
    if (x === undefined) { startGame('normal'); return; }
    for (const b of titleBtns) if (hit(b, x, y)) { b.act(); return; }
    return;
  }
  if (st === 'over') { if (overT > 0.6) st = 'title'; return; }
  if (st === 'play') holding = true;
}
function up() { holding = false; }
function toggleMute() { muted = !muted; try { localStorage.setItem('tflip_mute', muted ? '1' : '0'); } catch (e) {} }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (e.clientX < 64 && e.clientY > H - 64) { toggleMute(); return; }
  down(e.clientX, e.clientY);
});
addEventListener('pointerup', up); addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { initAudio(); if (e.code === 'KeyM') toggleMute(); if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); down(); } });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') up(); });

// ---- 更新 ----
function pop(text, color = '#fff', size = 1, dy = 0) {
  pops.push({text, color, size, t: 0, x: p.x, y: p.y + 1.4 + dy});
}
function fullName(turns, sh) {   // 1回宙返りは姿勢が技名に入る（タック/パイク/レイアウト）
  sh = sh || 'T';
  if (Math.abs(turns) === 1) return ({L: 'レイアウト', P: 'パイク', T: 'タック'})[sh] + (turns > 0 ? 'バラニー' : 'バック');
  return `${flipName(turns)}（${sh}）`;
}
function flipName(turns) {
  const n = Math.abs(turns), f = turns > 0;
  if (n === 1) return f ? 'タックバラニー' : 'タックバック';
  if (n === 2) return f ? 'バラニーアウト' : 'ダブルバック';
  if (n === 3) return f ? 'トリフィスアウト' : 'トリプルバック';
  return `${n}回宙返り（${f ? '前' : '後'}）`;
}
function launch() {
  p.contact = false; p.crouch = 0; p.w = 0; p.dir = 0; p.airT = 0; p.twisted = false; p.twist = -1; p.shape = null;
  p.opened = false; p.openK = 0; p.openTarget = 0; p.wasHolding = false; p.rotFace = p.face; p.plan = null;
  p.leanPh = Math.random() < 0.5 ? 0 : Math.PI;
  p.finalJump = p.final;   // 10本目の後は最後のストレートジャンプ
  p.forceDir = st === 'play' && lastDir ? -lastDir : 0;   // 演技中は前後を交互に固定
  if (p.drop) {            // 腹落ち・背落ちからの立て直しジャンプ
    p.drop = 0; p.recover = true; p.leanK = 0; p.bounceN = 0;
  } else {
    p.recover = false; p.th = 0; p.leanK = p.finalJump ? 0 : 1; p.y = footY();
  }
  p.bounceN++;
  let h = Math.min(st === 'title' ? 2.4 : MAXH, 1.0 + p.bounceN * 1.3);
  if (st === 'play' && h >= MAXH) h -= Math.random() * 0.8;   // 最高点付近は毎回少し高さが変わる
  if (p.finalJump && !p.recover) h = 2.4;
  p.vy = Math.sqrt(2 * G * h); p.apex = 0;
  if (st === 'play') jumps++;
}
// ---- 採点（FIG方式：D難度＋E演技＋T跳躍時間＋H移動） ----
// 難度点：1/4宙返り0.1、360°ごと＋0.1、1080°以上は360°ごとにさらに＋0.1、1/2ひねり0.1、
//   屈身・伸身：ひねりなし1回宙は＋0.1、2回宙以上は1回転ごと＋0.1、後方の2回宙＋0.1・3回宙＋0.2（2025年〜）
function difficulty(n, h, sh, dir) {
  const tw = h.reduce((a, b) => a + b, 0);
  let d = n * 0.4 + n * 0.1 + Math.max(0, n - 2) * 0.1 + tw * 0.1;   // 1/4宙返り・360°ボーナス・1080°以上・ひねり
  if (sh === 'P' || sh === 'L') { if (n >= 2) d += n * 0.1; else if (tw === 0) d += 0.1; }   // 姿勢ボーナス
  if (n === 2) d += Math.max(0, tw - 4) * 0.1;          // 2回宙：720°を超えるひねり 180°ごと＋0.1
  else if (n === 3) d += Math.max(0, tw - 2) * 0.2;     // 3回宙：360°を超えるひねり 180°ごと＋0.2
  else if (n >= 4) d += tw * 0.2;
  if (dir < 0) d += n === 2 ? 0.1 : n === 3 ? 0.2 : n >= 4 ? 0.3 : 0;   // 後方の多回転ボーナス
  return Math.round(d * 10) / 10;
}
function calcScore() {
  const n = el.length;
  const D = el.reduce((t, e) => t + e.d, 0);
  const E = Math.max(0, n - el.reduce((t, e) => t + e.ded, 0));   // 1本1.0点満点からの減点
  const T = el.reduce((t, e) => t + e.t, 0);                      // フライトタイムの合計
  const Hs = n;                                                    // 移動なし＝1本1.0点
  return {D, E, T, H: Hs, total: D + E + T + Hs};
}
const f1 = v => v.toFixed(1), f3 = v => v.toFixed(3);
function addElement(name, d, ded, t) {
  el.push({name, d, ded, t}); score = Math.round(calcScore().total * 1000) / 1000;
  pop(`${el.length}/10`, '#ffffff', 0.8, 1.5);

  ctx.beginPath(); ctx.arc(34, H - 34, 20, 0, TAU); ctx.fill(); ctx.restore();
  txt('♪', 34, H - 34, 20, muted ? 'rgba(255,255,255,.4)' : '#fff');
  if (muted) { ctx.strokeStyle = '#ff7070'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(22, H - 46); ctx.lineTo(46, H - 22); ctx.stroke(); }
  txt('v1.2', W - 14, H - 18, 11, 'rgba(255,255,255,.8)', 'right');
}
function draw() {
  drawBackground();
  drawTrampBack();
  drawPlayer();
  drawTrampFront();
  drawIndicator();
  drawHUD();
  drawOverlay();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
